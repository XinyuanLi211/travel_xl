you book.",link:"https://en.nia.gov.cn/n147418/n147463/index.html",linkLabel:"Check visa-free country list"},{id:"v2",text:"Visa-free policies change frequently. Confirm the latest rules on the Chinese embassy website in your country before departure.",link:"https://www.mfa.gov.cn/eng/zwjg/zgdsg/",linkLabel:"Find your nearest Chinese embassy"},{id:"v3",text:"If you need a visa: apply for an L visa (tourist) through the CVASC website. You'll need your passport (valid 6+ months), a colour photo on white background, return flight booking, hotel confirmation, and a travel itinerary.",link:"https://www.visaforchina.cn",linkLabel:"Apply for a Chinese visa"},{id:"v4",text:"Apply 4–6 weeks in advance — processing slows in peak season. Tourist = L visa, Business = M visa."}]},{title:"Travel Insurance",items:[{id:"i1",text:"Not mandatory, but strongly recommended. Chinese hospitals typically require upfront payment, and foreign health insurance cards are not accepted."},{id:"i2",text:"Make sure your policy covers: medical expenses, trip cancellation, lost luggage, and emergency evacuation."},{id:"i3",text:"Save your policy number and emergency hotline — store on your phone and print a copy."}]}]},{id:"p2",label:"1–2 Weeks Before",shortLabel:"1-2 Wks",icon:"📱",sections:[{title:"Payment Apps (Most Important)",items:[{id:"pay1",text:"Download WeChat. Register with your phone number. Go to Me → Services → Wallet to enable WeChat Pay and link your international Visa/Mastercard.",note:"You may need an existing WeChat user to verify your registration — ask a Chinese friend in advance.",expandTitle:"Full WeChat Pay Setup Guide",expandContent:`What You'll Need: A smartphone, a working phone number (any country), your passport, an international Visa/Mastercard/Amex card, and stable internet.

Step 1 — Download WeChat from the App Store or Google Play. Use the international version.

Step 2 — Register. Enter your phone number, receive an SMS code, and complete verification. You may need an existing WeChat user to scan a QR code to verify you.

Step 3 — Enable WeChat Pay. Go to Me → Settings → General → Tools → Weixin Pay. Tap Enable and set a 6-digit payment password.

Step 4 — Passport Verification. Go to Me → Services → Wallet. Enter your full name exactly as on your passport. Select "Passport" as ID type. Upload a photo of your passport's identity page and complete a face scan. Approval usually takes 1–3 business days.

Step 5 — Link Your Card. Go to Me → Services → Wallet → Cards → Add a Card. Enter your card details. You may receive a one-time password from your bank. Contact your bank beforehand to enable overseas transactions.

Step 6 — Test It. Scan any merchant QR code and make a small payment (even ¥1) to confirm it works.

Common Issues:
• "Verification failed" → Make sure the name matches your passport exactly. Retake the passport photo in good lighting.
• Can't receive SMS → Check international roaming settings.
• Payment declined → Try Alipay instead. Some merchants only work with one app.
• Card linking fails → Try a different card. Confirm your bank allows online international payments.

Note: Foreign users cannot send red packets, transfer money to other users, or use WeChat Pay outside mainland China.`},{id:"pay2",text:"Download Alipay. Register with your phone number, link your international credit card.",note:"Alipay is more foreigner-friendly than WeChat — easier setup. Also lets you book trains, hail rides, and find restaurants.",expandTitle:"Full Alipay Setup Guide",expandContent:`What You'll Need: A smartphone, a phone number from any country, your passport, and an international Visa/Mastercard/Amex card.

Step 1 — Download Alipay from the App Store or Google Play (blue logo with the letter "A"). The app detects your region automatically.

Step 2 — Register. Enter your phone number, receive an SMS code, create a login password and a separate 6-digit payment password.

Step 3 — Identity Verification (most important step):
• Go to Me → Settings → Account and Security → Identity Information.
• Enter your full name exactly as on your passport. Select "Passport" and enter the number.
• Upload a clear photo of your passport's identity page (make sure the MRZ lines at the bottom are readable).
• Complete a face scan — use natural daylight, plain background, remove glasses.
• Approval usually takes 5–30 minutes, sometimes up to 72 hours.

Step 4 — Link Your Card. Go to Me → Bank Cards → Add Bank Card. Enter card details. Your bank will trigger 3-D Secure verification. Tell your bank in advance that you're planning to use the card in China.

Step 5 — Test It. Scan any merchant QR code and make a small payment. If it works, you're ready!

Fee-saving tip: Purchases under ¥200 have zero Alipay fees. Split larger payments if possible.

Common Issues:
• Face scan fails → Try in natural daylight, plain background, no glasses.
• SMS code not arriving → Check roaming settings or try Wi-Fi calling.
• Card linking rejected → Contact your bank first — most failures are on their side.
• "Risk control" or frozen account → Wait 24 hours and retry. Use WeChat Pay as backup.

You CAN: pay at shops, ride the metro, book trains, use Didi, order food delivery.
You CANNOT: transfer money to Chinese users, use investment features, or use Alipay outside mainland China.`}]},{title:"Navigation Apps",items:[{id:"nav1",text:"iPhone users: just use Apple Maps. It uses Amap (Gaode) data for China, has English interface, and works out of the box — no extra download needed."},{id:"nav2",text:"Android users: download Amap (高德地图) and switch to English in settings."},{id:"nav3",text:"Backup: download maps.me offline maps for China — works without internet.",warn:"Google Maps does NOT work in China. Even with a VPN, GPS coordinates are offset by 100–700 metres due to China's coordinate system. This is a legal requirement, not a network issue."}]},{title:"Transport Apps",items:[{id:"t1",text:"Download DiDi (滴滴出行) — China's Uber. Has English interface. Enter your destination and the driver follows GPS — no Chinese needed.",note:"Tip: screenshot your hotel's Chinese name and address. Show it to drivers if DiDi has issues."},{id:"t2",text:"Download Trip.com — book trains, flights, and hotels. The most foreigner-friendly booking platform. Supports English and international credit cards."},{id:"t3",text:"(Optional) Download 12306 — China's official rail app. Cheapest tickets, but registration requires passport verification (photo upload + selfie). Foreign credit cards are unreliable. If Trip.com works for you, skip this."}]},{title:"Daily Life Apps",items:[{id:"l1",text:"Download Dianping (大众点评) — China's Yelp. Find restaurants, read reviews, see photos of dishes.",note:"It's in Chinese, but the photos and ratings are universal. Use with your translation app."},{id:"l2",text:"Download Google Translate (with Chinese offline pack) or Apple Translate.",note:"Both support camera translation — point at any menu and it translates instantly."}]},{title:"Internet & VPN",items:[{id:"vpn0",text:"You DON'T always need a VPN in China. If you're using a non-Chinese SIM card with international roaming, your phone routes through your home carrier's network and bypasses the firewall — Google, WhatsApp, Instagram often work without a VPN.",note:"Before you pay for a VPN, check with your carrier whether roaming data works in China. Many UK/US/EU plans include China roaming."},{id:"vpn1",text:"But there's a catch: roaming data is usually expensive and slow. If you buy a local Chinese SIM for cheaper data (which most long-stay visitors do), then Google, WhatsApp, Instagram, YouTube, Facebook and Twitter are ALL blocked — you will need a VPN.",warn:"You MUST download and install any VPN before departure. VPN websites are blocked inside China — you can't download one after you arrive."},{id:"vpn2",text:"What I recommend: use both. Keep your home SIM for WhatsApp and Google Maps. Buy a cheap local SIM or eSIM for everything else (Alipay, DiDi, Amap, calling local numbers). Most modern phones support dual SIM or eSIM, so you can run both at the same time.",note:"This way you get cheap local data for daily apps AND unrestricted access to Western apps on your home SIM — no VPN needed."},{id:"vpn3",text:"If you do need a VPN: install two (no single VPN is 100% reliable in China). Astrill is the most stable (~$30/mo). ExpressVPN works for short trips (~$13/mo). NordVPN is a budget backup (~$4/mo)."}]}]},{id:"p3",label:"Day One",shortLabel:"Day 1",icon:"🛬",sections:[{title:"Immediately After Landing",items:[{id:"d1",text:"Confirm your phone works — can you load a webpage? Can you send a WeChat message?"},{id:"d2",text:"Test your payment — buy a bottle of water at a convenience store using WeChat Pay or Alipay."},{id:"d3",text:"If using a VPN, turn it on and confirm you can access Google, WhatsApp, and your email."}]},{title:"Cash",items:[{id:"c1",text:"Carry 500–1,000 RMB in cash as backup. Street vendors, some taxis, and remote attractions may only accept cash."},{id:"c2",text:"Exchange currency at your home bank before departure, or withdraw from airport ATMs on arrival (watch for fees and exchange rates)."}]},{title:"Airport to City Centre",items:[{id:"a1",text:"Most major cities have metro lines direct from the airport — cheapest and often fastest option."},{id:"a2",text:"For taxis, use DiDi to hail a ride. Or join the official taxi queue outside arrivals."}]}]},{id:"p4",label:"On the Road",shortLabel:"Travel",icon:"🧭",sections:[{title:"Ordering Food Without Chinese",items:[{id:"f1",text:"Use your translation app's camera mode — point at the menu and it translates live."},{id:"f2",text:"Search the restaurant on Dianping and scroll through photos of dishes. Point at a photo to order."},{id:"f3",text:`Point at another table's food and say "wǒ yào zhè ge" (我要这个) — "I want this one."`},{id:"f4",text:"Money-saving tip: portions in China are huge. Two people only need 2–3 dishes — don't order one each like in the West."}]},{title:"Train Tickets",items:[{id:"tr1",text:"Book on Trip.com in advance — English interface, international cards accepted."},{id:"tr2",text:"At the station, use the foreigner lane or scan your passport at the gate to enter."},{id:"tr3",text:"Book popular routes (Beijing–Shanghai, etc.) several days ahead. During holidays, book a week or more in advance."}]},{title:"Getting a Taxi",items:[{id:"tx1",text:"Use DiDi — enter your destination and the driver follows GPS navigation. No speaking required."},{id:"tx2",text:"Keep a screenshot of your hotel's Chinese name and address on your phone. Show it to any driver if needed."}]},{title:"Toilets (Seriously Important)",items:[{id:"wc1",text:"Many public toilets in China don't provide toilet paper. Always carry tissues and wet wipes."},{id:"wc2",text:"Tourist sites and train stations mostly have squat toilets. Shopping malls, hotels, and Starbucks have Western-style ones."}]},{title:"If You Get Sick",items:[{id:"m1",text:"Minor issues: visit a pharmacy (药店) — they're everywhere. Staff can usually understand you pointing at what hurts."},{id:"m2",text:"Serious issues: go to a hospital emergency department (急诊). Major cities' top-tier hospitals usually have International Clinics with English-speaking staff."},{id:"m3",text:'Prepare in advance: save "I am allergic to [X]" translated into Chinese on your phone.'}]},{title:"Lost Your Phone",items:[{id:"lo1",text:"Ask your hotel front desk for help — they can assist with calling police and your mobile carrier."},{id:"lo2",text:"Backup plan: always carry a hotel business card, keep some cash in your pocket, and store important info (passport number, insurance policy, emergency contacts) in your email."}]},{title:"Emergency Numbers",items:[{id:"em1",text:"Police: 110 · Ambulance: 120 · Fire: 119 · Traffic accident: 122"},{id:"em2",text:"Foreigner helpline: 12345 (some cities offer English service)"}]}]}],Rd=[{en:"Hello",py:"nǐ hǎo",cn:"你好"},{en:"Thank you",py:"xiè xie",cn:"谢谢"},{en:"How much?",py:"duō shao qián?",cn:"多少钱？"},{en:"I want this",py:"wǒ yào zhè ge",cn:"我要这个"},{en:"Too expensive",py:"tài guì le",cn:"太贵了"},{en:"Where's the toilet?",py:"cè suǒ zài nǎ?",cn:"厕所在哪？"},{en:"Metro station",py:"dì tiě zhàn",cn:"地铁站"},{en:"No spicy food",py:"wǒ bù chī là",cn:"我不吃辣"},{en:"Bill please",py:"mǎi dān",cn:"买单"},{en:"Help!",py:"jiù mìng!",cn:"救命!"},{en:"No thanks",py:"bú yào",cn:"不要"},{en:"Cheaper?",py:"pián yi diǎn",cn:"便宜点"}];function Fd(){return k.jsxs("svg",{width:"100%",height:"32",viewBox:"0 0 400 32",preserveAspectRatio:"none",style:{display:"block",opacity:.06},children:[k.jsx("path",{d:"M0,24 Q50,8 100,20 Q150,32 200,16 Q250,4 300,20 Q350,32 400,12",fill:"none",stroke:_.red,strokeWidth:"2"}),k.jsx("path",{d:"M0,28 Q50,12 100,24 Q150,36 200,20 Q250,8 300,24 Q350,36 400,16",fill:"none",stroke:_.gold,strokeWidth:"1.5"})]})}function Id({done:e,total:t}){const n=Math.round(e/t*100);return k.jsxs("div",{children:[k.jsxs("div",{style:{display:"flex",justifyContent:"space-between",fontSize:13,color:_.inkLight,marginBottom:6,fontFamily:"-apple-system, sans-serif"},children:[k.jsxs("span",{children:[e," of ",t," steps complete"]}),k.jsxs("span",{style:{fontW
